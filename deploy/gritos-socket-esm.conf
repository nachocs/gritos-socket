# systemd drop-in for gritos-socket.
#
# Install on the server as:
#   /etc/systemd/system/gritos-socket.service.d/esm.conf
# then: systemctl daemon-reload && systemctl restart gritos-socket
#
# The vendor unit (/usr/lib/systemd/system/gritos-socket.service) points at
# dist/index.js, which was Babel's output directory. The app now runs its
# ES modules directly on Node, so there is no dist/ any more and both the
# ExecStart and the WorkingDirectory have to move up to the repo root.
#
# The empty ExecStart= is required: systemd appends to ExecStart by default,
# and clearing it first is the only way to replace the inherited value.
#
# This sits alongside the existing node24.conf drop-in, which sets the PATH
# that selects Node 24. Both are needed; neither replaces the other.
#
# To revert: delete this file, systemctl daemon-reload, restart.

[Service]
ExecStart=
ExecStart=/home/gritos/socket/gritos-socket/src/index.js
WorkingDirectory=/home/gritos/socket/gritos-socket/
